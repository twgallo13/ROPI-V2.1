name: Migration - FD ZAHARA-S-WHT

on:
  workflow_dispatch:
    inputs:
      productId:
        description: 'Product ID to migrate'
        required: true
        default: 'FD ZAHARA-S-WHT'

jobs:
  migrate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd functions && npm ci

      - name: Setup Firebase credentials
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$SERVICE_ACCOUNT_JSON" > serviceAccountKey.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$PWD/serviceAccountKey.json" >> $GITHUB_ENV

      - name: Backup - Fetch current product
        run: |
          node -e "
          const admin = require('firebase-admin');
          const fs = require('fs');
          const serviceAccount = require('./serviceAccountKey.json');
          admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });
          const db = admin.firestore();
          (async () => {
            const doc = await db.collection('products').doc('${{ inputs.productId }}').get();
            if (doc.exists) {
              const data = { id: doc.id, ...doc.data() };
              fs.writeFileSync('backup-product.json', JSON.stringify(data, null, 2));
              console.log('=== BACKUP PRODUCT ===');
              console.log(JSON.stringify(data, null, 2));
              console.log('=== END BACKUP ===');
            } else {
              console.log('Product not found');
              fs.writeFileSync('backup-product.json', JSON.stringify({ error: 'Product not found' }, null, 2));
            }
          })();
          "

      - name: Run migration
        run: |
          echo "=== MIGRATION START ==="
          node scripts/migrateLegacyToCanonical.cjs --product-ids="${{ inputs.productId }}" 2>&1 | tee migration-output.txt
          echo "=== MIGRATION END ==="

      - name: API Smoke Check - SmartDetect
        run: |
          echo "=== SMART DETECT API ==="
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" \
            -X POST https://ropi-bccee.web.app/apiSmartDetect \
            -H "Content-Type: application/json" \
            -d '{"productId":"${{ inputs.productId }}"}' \
            | tee smartdetect-response.json
          echo ""
          echo "=== END SMART DETECT ==="

      - name: API Smoke Check - Validate
        run: |
          echo "=== VALIDATE API ==="
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" \
            -X POST https://ropi-bccee.web.app/apiValidate \
            -H "Content-Type: application/json" \
            -d '{"productId":"${{ inputs.productId }}"}' \
            | tee validate-response.json
          echo ""
          echo "=== END VALIDATE ==="

      - name: API Smoke Check - Describe
        run: |
          echo "=== DESCRIBE API ==="
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" \
            -X POST https://ropi-bccee.web.app/api/describe \
            -H "Content-Type: application/json" \
            -d '{"productId":"${{ inputs.productId }}"}' \
            | tee describe-response.json
          echo ""
          echo "=== END DESCRIBE ==="

      - name: Final snapshot - Fetch updated product
        run: |
          node -e "
          const admin = require('firebase-admin');
          const fs = require('fs');
          const db = admin.firestore();
          (async () => {
            const doc = await db.collection('products').doc('${{ inputs.productId }}').get();
            if (doc.exists) {
              const data = { id: doc.id, ...doc.data() };
              fs.writeFileSync('final-product.json', JSON.stringify(data, null, 2));
              console.log('=== FINAL PRODUCT ===');
              console.log(JSON.stringify(data, null, 2));
              console.log('=== END FINAL ===');
            } else {
              console.log('Product not found after migration');
              fs.writeFileSync('final-product.json', JSON.stringify({ error: 'Product not found' }, null, 2));
            }
          })();
          "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-artifacts-${{ inputs.productId }}
          path: |
            backup-product.json
            migration-output.txt
            smartdetect-response.json
            validate-response.json
            describe-response.json
            final-product.json
          retention-days: 30

      - name: Cleanup credentials
        if: always()
        run: rm -f serviceAccountKey.json

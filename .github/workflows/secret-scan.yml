name: Secret Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better detection
      
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          # Scan the entire repository
          path: ./
          # Scan from base to head for PRs, or last 100 commits for pushes
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'HEAD' }}
          # Additional arguments
          extra_args: --only-verified --json --fail
      
      - name: Report results
        if: failure()
        run: |
          echo "❌ Secret scan detected potential secrets in the codebase!"
          echo "Review the TruffleHog output above for details."
          echo "If these are false positives, consider adding them to .trufflehog-ignore"
          exit 1
      
      - name: Success message
        if: success()
        run: |
          echo "✅ No verified secrets detected"

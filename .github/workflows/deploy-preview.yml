name: Deploy AOSS PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install -g pnpm@8
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            pnpm install
          else
            echo "No package.json found, skipping dependency installation"
          fi
      - name: Build (if web exists)
        run: |
          if [ -f packages/web/package.json ]; then
            pnpm --filter @ropi-aoss/web build || echo "Web build failed (not implemented)"
          else
            echo "No packages/web found — will create placeholder later"
          fi
      - name: Prepare public directory for preview
        run: |
          set -euo pipefail
          echo "Preparing public/ for preview hosting..."
          # ensure clean public folder
          rm -rf public || true
          mkdir -p public

          # If packages/web exists, try to build and locate output
          if [ -f packages/web/package.json ]; then
            echo "packages/web detected — attempting build"
            # run build (non-fatal; proceed to check output)
            pnpm --filter @ropi-aoss/web build || echo "packages/web build returned non-zero; continuing to try to find output"

            CANDIDATES=(
              "packages/web/dist"
              "packages/web/build"
              "packages/web/out"
              "packages/web/.next"
            )

            COPIED=false
            for d in "${CANDIDATES[@]}"; do
              if [ -d "$d" ]; then
                echo "Copying build output from ${d} to public/"
                rsync -a --delete "${d}/" public/
                COPIED=true
                break
              fi
            done

            # If .next exists and static export present, copy out/
            if [ "$COPIED" = false ] && [ -d "packages/web/.next" ] && [ -d "packages/web/out" ]; then
              rsync -a --delete "packages/web/out/" public/
              COPIED=true
            fi
          fi

          # If nothing was copied, create a placeholder index.html
          if [ ! -f public/index.html ]; then
            echo "No build output found — creating placeholder public/index.html"
            cat > public/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><title>Ropi AOSS — PR Preview</title>
          <style>body{font-family:system-ui, -apple-system, sans-serif;background:#f6f7fb;display:flex;height:100vh;align-items:center;justify-content:center} .card{background:white;padding:28px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.08);max-width:720px;text-align:center}</style>
          </head><body><div class="card"><h1>Ropi AOSS — PR Preview</h1><p>This is an auto-generated preview placeholder.</p><p>If you expect live app content, ensure the packages/web build outputs files under <code>packages/web/dist</code> or similar.</p></div></body></html>
          HTML
          fi

          # final check
          if [ ! -f public/index.html ]; then
            echo "::error::public/index.html still missing after prepare step"
            exit 1
          fi
          echo "public/ is ready for preview deployment."
      - name: Ensure firebase.json exists
        run: |
          if [ ! -f firebase.json ]; then
            echo "Creating minimal firebase.json"
            echo '{"hosting":{"public":"public","ignore":["firebase.json","**/.*","**/node_modules/**"]}}' > firebase.json
          fi
      - name: Setup gcloud authentication
        env:
          GCP_SA_KEY_BASE64: ${{ secrets.GCP_SA_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GCP_SA_KEY_BASE64:-}" ]; then
            echo "::warning::GCP_SA_KEY_BASE64 not set — skipping preview firebase deploy for fork security."
            exit 0
          fi
          echo "Decoding service account key..."
          echo "$GCP_SA_KEY_BASE64" | base64 --decode > "$HOME/gcloud-key.json"
          # Set ADC for this step
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/gcloud-key.json"
          # Authenticate with gcloud
          sudo apt-get update && sudo apt-get install -y google-cloud-cli
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project ropi-bccee
          # Persist ADC env var for subsequent steps
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud-key.json" >> $GITHUB_ENV
          echo "Active gcloud account:"
          gcloud auth list --filter=status:ACTIVE --format="value(account)"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Deploy to preview channel
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            echo "::warning::GOOGLE_APPLICATION_CREDENTIALS not set — skipping preview deploy"
            exit 0
          fi
          
          echo "Using GOOGLE_APPLICATION_CREDENTIALS: $GOOGLE_APPLICATION_CREDENTIALS"
          
          # Deploy to preview channel on aoss-staging target
          PR_NUM=${{ github.event.pull_request.number }}
          CHANNEL=pr-${PR_NUM}
          firebase hosting:channel:deploy "${CHANNEL}" --only aoss-staging --project ropi-bccee --json > deploy.json || {
            echo "::warning::Firebase preview deployment failed (may need additional permissions)"
            cat deploy.json || true
            exit 0
          }
          echo "Deploy output:"
          cat deploy.json
          # Try to extract a URL
          PREVIEW_URL=$(jq -r '.result[0].site // empty' deploy.json || true)
          echo "PREVIEW_URL=${PREVIEW_URL}"
          echo "===="
      - name: Post preview URL to PR
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ✅ Preview deployed to Firebase Hosting preview channel `pr-${{ github.event.pull_request.number }}`.
            Check the Actions run logs for the exact preview URL (Firebase prints it in the deploy output).

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f "$HOME/gcloud-key.json"
          echo "Key file removed from runner"

name: Deploy AOSS PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install -g pnpm@8
      - name: Install dependencies
        run: pnpm install
      
      - name: Build web app
        run: |
          set -euo pipefail
          echo "Building @ropi-aoss/web package..."
          pnpm --filter @ropi-aoss/web build
          echo "Build complete. Checking output directory..."
          ls -lah packages/web/dist || echo "::error::packages/web/dist not found after build"
      
      - name: Verify build output
        run: |
          set -euo pipefail
          echo "Listing packages/web directory structure:"
          ls -R packages/web
          echo ""
          echo "Checking for dist directory:"
          if [ -d "packages/web/dist" ]; then
            echo "✅ packages/web/dist exists"
            echo "Contents:"
            ls -lah packages/web/dist
            if [ ! -f "packages/web/dist/index.html" ]; then
              echo "::error::packages/web/dist/index.html missing"
              exit 1
            fi
          else
            echo "::error::packages/web/dist directory not found"
            exit 1
          fi
      
      - name: Prepare public directory for preview
        run: |
          set -euo pipefail
          echo "Preparing public/ directory from packages/web/dist..."
          rm -rf public || true
          mkdir -p public
          if [ -d "packages/web/dist" ]; then
            echo "Copying from packages/web/dist to public/"
            cp -r packages/web/dist/* public/
          else
            echo "::error::packages/web/dist not found - cannot prepare public/"
            exit 1
          fi
          if [ ! -f public/index.html ]; then
            echo "::error::public/index.html missing after copy"
            exit 1
          fi
          echo "public/ directory prepared successfully"
      - name: Setup gcloud authentication
        env:
          GCP_SA_KEY_BASE64: ${{ secrets.GCP_SA_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GCP_SA_KEY_BASE64:-}" ]; then
            echo "::warning::GCP_SA_KEY_BASE64 not set — skipping preview firebase deploy for fork security."
            exit 0
          fi
          echo "Decoding service account key..."
          echo "$GCP_SA_KEY_BASE64" | base64 --decode > "$HOME/gcloud-key.json"
          # Set ADC for this step
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/gcloud-key.json"
          # Authenticate with gcloud
          sudo apt-get update && sudo apt-get install -y google-cloud-cli
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project ropi-bccee
          # Persist ADC env var for subsequent steps
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud-key.json" >> $GITHUB_ENV
          echo "Active gcloud account:"
          gcloud auth list --filter=status:ACTIVE --format="value(account)"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Deploy to preview channel
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            echo "::warning::GOOGLE_APPLICATION_CREDENTIALS not set — skipping preview deploy"
            exit 0
          fi

          echo "Using GOOGLE_APPLICATION_CREDENTIALS: $GOOGLE_APPLICATION_CREDENTIALS"

          # Create a temporary firebase config that points hosting at the prepared public/ folder.
          cat > firebase_preview.json <<'JSON'
          {
            "hosting": [
              {
                "target": "aoss-staging",
                "public": "public",
                "ignore": [
                  "firebase.json",
                  "**/.*",
                  "**/node_modules/**"
                ],
                "rewrites": [
                  { "source": "**", "destination": "/index.html" }
                ]
              }
            ]
          }
          JSON

          # Deploy to preview channel on aoss-staging target using the temporary config
          PR_NUM=${{ github.event.pull_request.number }}
          CHANNEL=pr-${PR_NUM}
          firebase hosting:channel:deploy "${CHANNEL}" --only aoss-staging --project ropi-bccee --config firebase_preview.json --json > deploy.json || {
            echo "::error::Firebase preview deployment failed"
            cat deploy.json || true
            exit 1
          }
          echo "Deploy output:"
          cat deploy.json
          PREVIEW_URL=$(jq -r '.result["aoss-staging"].url // empty' deploy.json || true)
          echo "PREVIEW_URL=${PREVIEW_URL}"
          if [ -n "$PREVIEW_URL" ]; then
            echo "Preview available at: $PREVIEW_URL"
          fi
          echo "===="
      - name: Post preview URL to PR
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ✅ Preview deployed to Firebase Hosting preview channel `pr-${{ github.event.pull_request.number }}`.
            Check the Actions run logs for the exact preview URL (Firebase prints it in the deploy output).

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f "$HOME/gcloud-key.json"
          echo "Key file removed from runner"

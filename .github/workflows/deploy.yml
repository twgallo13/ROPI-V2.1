name: Deploy to Firebase Hosting
on:
  push:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_CI_TOKEN }}
      PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install root deps
        run: npm ci
      - name: Install functions deps
        run: npm --prefix functions ci
      - name: Pre-check required secrets
        run: |
          echo "Checking required secrets for deployment..."
          MISSING=""
          
          if [ -z "${{ secrets.VITE_FIREBASE_API_KEY }}" ]; then
            echo "❌ VITE_FIREBASE_API_KEY is missing"
            MISSING="$MISSING VITE_FIREBASE_API_KEY"
          else
            echo "✓ VITE_FIREBASE_API_KEY is set"
          fi
          
          if [ -z "${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" ]; then
            echo "❌ VITE_FIREBASE_AUTH_DOMAIN is missing"
            MISSING="$MISSING VITE_FIREBASE_AUTH_DOMAIN"
          else
            echo "✓ VITE_FIREBASE_AUTH_DOMAIN is set"
          fi
          
          if [ -z "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" ]; then
            echo "❌ VITE_FIREBASE_PROJECT_ID is missing"
            MISSING="$MISSING VITE_FIREBASE_PROJECT_ID"
          else
            echo "✓ VITE_FIREBASE_PROJECT_ID is set"
          fi
          
          if [ -z "${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" ]; then
            echo "❌ VITE_FIREBASE_STORAGE_BUCKET is missing"
            MISSING="$MISSING VITE_FIREBASE_STORAGE_BUCKET"
          else
            echo "✓ VITE_FIREBASE_STORAGE_BUCKET is set"
          fi
          
          if [ -z "${{ secrets.VITE_FIREBASE_APP_ID }}" ]; then
            echo "❌ VITE_FIREBASE_APP_ID is missing"
            MISSING="$MISSING VITE_FIREBASE_APP_ID"
          else
            echo "✓ VITE_FIREBASE_APP_ID is set"
          fi
          
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "❌ GEMINI_API_KEY is missing"
            MISSING="$MISSING GEMINI_API_KEY"
          else
            echo "✓ GEMINI_API_KEY is set"
          fi
          
          if [ -n "$MISSING" ]; then
            echo ""
            echo "❌ Deployment failed: Missing required secrets:$MISSING"
            echo "Please add these secrets in GitHub Settings → Secrets and variables → Actions"
            exit 1
          fi
          
          echo ""
          echo "✅ All required secrets are present"
      - name: Build (Vite)
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build
      - name: Build Functions
        run: npm run build:functions
      - name: Deploy Hosting + Functions
        if: ${{ env.FIREBASE_TOKEN != '' && env.PROJECT_ID != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm i -g firebase-tools
          firebase use "$PROJECT_ID"
          export GEMINI_API_KEY="${GEMINI_API_KEY}"
          firebase deploy --only hosting,functions

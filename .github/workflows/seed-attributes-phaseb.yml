set -euo pipefail
IFS=$'\n\t'

REPO="twgallo13/ROPI-V2.1"
WORKDIR="/workspaces/ROPI-V2.1"
WF_PATH=".github/workflows/seed-attributes-phaseb.yml"
BRANCH_FIX="fix/phaseb-yaml-$(date -u +%Y%m%dT%H%M%SZ)"
REF="main"
PR_NUM=98
APPROVAL="Approve — seed to PRODUCTION"
ENVIRONMENT="PRODUCTION"
ART_DIR="operations/review-artifacts/attribute-registry"

cd "$WORKDIR"

# 1) Create fix branch
git fetch origin
git checkout -b "$BRANCH_FIX" origin/main

# 2) Replace the workflow with the corrected content
cat > "$WF_PATH" <<'YAML'
<PASTE THE CORRECTED YAML FROM THE PREVIOUS BLOCK HERE>
YAML

# 3) Show a quick preview so humans can verify
sed -n '1,200p' "$WF_PATH"

# 4) Commit & push
git add "$WF_PATH"
git -c user.name='Homer (automation)' -c user.email='homer@shiekhshoes.org' commit -m "ci: fix Phase B workflow YAML (Debug run + verify env handling)"
git push -u origin "$BRANCH_FIX"

# 5) Open PR to main for human quick check (or merge directly if allowed)
gh pr create --repo "$REPO" --title "ci: fix Phase B workflow YAML" --body "Fix YAML syntax for Phase B: add Debug run block and use ENVIRONMENT env var in verify step. Please review and merge to main." --base main --head "$BRANCH_FIX"

# OPTIONAL: If you have permission to merge and want to auto-merge:
# gh pr merge --repo "$REPO" --web

# If we do not auto-merge, wait for PR merge. Otherwise, after merge:
# 6) If PR merged, ensure main is updated locally
git checkout main
git pull origin main

# 7) Run quick verification tests (non-watch)
npm ci
npm run lint || true
npm test -- --run
npm run build
npm --prefix functions ci
npm --prefix functions test -- --run

# 8) Dispatch workflow (if you have permission), else ask the user to Run workflow manually
if gh workflow run "$WF_PATH" --repo "$REPO" --ref "$REF" -f approval="$APPROVAL" -f environment="$ENVIRONMENT"; then
  echo "Workflow dispatched."
  sleep 4
  RUN_ID=$(gh run list --repo "$REPO" --workflow="$WF_PATH" --branch "$REF" --limit 1 --json databaseId --jq '.[0].databaseId')
  echo "Run: https://github.com/$REPO/actions/runs/$RUN_ID"
  # Monitor run
  gh run watch "$RUN_ID" --repo "$REPO" || echo "Monitor the run in Actions UI"
  # Collect artifacts via existing collector
  if [[ -x "./operations/collect-phaseb-artifacts.sh" ]]; then
    ./operations/collect-phaseb-artifacts.sh "$RUN_ID"
  else
    echo "Collector not present, please run the collector once run finishes."
  fi
else
  echo "Unable to dispatch workflow via gh. Please open Actions UI and Run workflow manually on main with environment=PRODUCTION and approval string exactly: $APPROVAL"
fi

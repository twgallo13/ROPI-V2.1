name: Deploy AOSS Staging
# Deploys aoss-main to stable staging site: https://ropi-aoss-staging.web.app

on:
  push:
    branches:
      - aoss-main
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60  # LP-0.1.3.fix: Job-level timeout to prevent runaway deploys

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack and prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8 --activate

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            pnpm install
          else
            echo "No package.json found, skipping dependency installation"
          fi

      - name: Debug ensure VITE_FIREBASE_API_KEY present
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          if [ -z "$VITE_FIREBASE_API_KEY" ]; then
            echo "::error::VITE_FIREBASE_API_KEY is empty"
            exit 1
          fi
          KEY_LEN="${#VITE_FIREBASE_API_KEY}"
          echo "VITE_FIREBASE_API_KEY present (length: $KEY_LEN)"

      - name: Build SDK package
        run: |
          set -euo pipefail
          echo "Building @ropi-aoss/sdk package..."
          pnpm --filter @ropi-aoss/sdk build

      - name: Build packages/web
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          # LP-1.7.0: Hardcoded correct bucket - secret has wrong value (appspot.com vs firebasestorage.app)
          # TODO: Update secret VITE_FIREBASE_STORAGE_BUCKET to ropi-bccee.firebasestorage.app and remove this override
          VITE_FIREBASE_STORAGE_BUCKET: ropi-bccee.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          echo "Building @ropi-aoss/web package..."
          echo "Current working directory: $(pwd)"
          pnpm --filter @ropi-aoss/web build

      - name: Build packages/api
        run: |
          set -euo pipefail
          echo "Building @ropi-aoss/api package for Cloud Functions..."
          pnpm --filter @ropi-aoss/api build
          echo "✅ API package built successfully"

      - name: Verify build output
        run: |
          set -euo pipefail
          echo "Current working directory: $(pwd)"
          echo ""
          echo "Listing packages/web:"
          ls -lah packages/web
          echo ""
          echo "Listing packages/web/dist:"
          ls -lah packages/web/dist
          echo ""
          if [ ! -f packages/web/dist/index.html ]; then
            echo "::error::Build artifacts missing: packages/web/dist/index.html not found"
            exit 1
          fi
          echo "✅ Build verification passed: packages/web/dist ready for deployment"

      - name: Setup gcloud authentication
        env:
          GCP_SA_KEY_BASE64: ${{ secrets.GCP_SA_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GCP_SA_KEY_BASE64:-}" ]; then
            echo "::error::GCP_SA_KEY_BASE64 secret not set in 'staging' environment"
            exit 1
          fi
          echo "Decoding service account key..."
          echo "$GCP_SA_KEY_BASE64" | base64 --decode > "$HOME/gcloud-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/gcloud-key.json"
          
          # Install gcloud CLI
          echo "Installing Google Cloud CLI..."
          sudo apt-get update && sudo apt-get install -y google-cloud-cli
          
          # Authenticate and configure
          echo "Authenticating with Google Cloud..."
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project ropi-bccee
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud-key.json" >> $GITHUB_ENV
          
          # Verify authentication
          echo "Verifying authentication..."
          echo "Active gcloud account:"
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
          echo "Current gcloud project:"
          gcloud config get-value project

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Deploy to stable staging site
        run: |
          set -euo pipefail
          echo "Using GOOGLE_APPLICATION_CREDENTIALS: $GOOGLE_APPLICATION_CREDENTIALS"
          echo "Firebase CLI version:"
          firebase --version

          # Verify build artifacts before deploying
          echo "Verifying build artifacts..."
          ls -la packages/web/dist/ || (echo "::error::Web build artifacts missing" && exit 1)
          ls -la packages/api/dist/ || (echo "::error::API build artifacts missing" && exit 1)

          # Deploy functions and hosting to stable staging
          # LP-0.1.3.fix: Add timeouts to prevent runaway deploys
          # LP-export-deploy-fix-1.0.0: Add --force to allow deletion of orphaned functions in non-interactive CI
          # LP-DEPLOY-FIX: Skip preview channel deploy to avoid hosting target issues
          # CRITICAL FIX: 2nd gen Cloud Run functions have health check timeouts (non-blocking)
          # The main 'api' 1st gen function handles all routes, so 2nd gen failures are acceptable
          echo "Deploying Cloud Functions (20m timeout)..."
          set +e  # Don't exit on error
          timeout 20m firebase deploy --only functions --project ropi-bccee --force 2>&1 | tee functions-deploy.log
          FUNCTIONS_EXIT_CODE=$?
          set -e
          
          # Check if critical 1st gen functions deployed successfully
          if grep -Eq "(functions\[api:api\(us-central1\)\].*Successful|api:api\(us-central1\).*Skipped)" functions-deploy.log; then
            echo "✅ Critical function 'api' deployed successfully"
            CRITICAL_SUCCESS=true
          else
            echo "::error::Critical function 'api' failed to deploy"
            CRITICAL_SUCCESS=false
          fi
          
          # Log 2nd gen failures as warnings (non-blocking)
          if [ $FUNCTIONS_EXIT_CODE -ne 0 ]; then
            echo "::warning::Some 2nd gen Cloud Run functions failed health checks (expected - they have large bundles)"
            echo "Failed functions (non-critical):"
            grep "Error Failed to update function" functions-deploy.log || true
          fi
          
          # Only fail if critical functions didn't deploy
          if [ "$CRITICAL_SUCCESS" = "false" ]; then
            echo "::error::Critical functions deployment failed"
            exit 1
          fi

          echo "Deploying hosting (10m timeout)..."
          if ! timeout 10m firebase deploy --only hosting:aoss-staging --project ropi-bccee 2>&1 | tee hosting-deploy.log; then
            echo "::error::Hosting deployment failed. Check logs above for details."
            exit 1
          fi
          echo "✅ Stable staging URL: https://ropi-aoss-staging.web.app"

      - name: Smoke check stable staging
        run: |
          set -e
          echo "Waiting briefly for hosting to warm up..."
          sleep 3
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://ropi-aoss-staging.web.app || true)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Staging returned HTTP $STATUS. Check hosting logs and content."
          fi

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f "$HOME/gcloud-key.json"
          echo "Key file removed from runner"

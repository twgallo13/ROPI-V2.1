name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Install root deps
        run: npm ci

      - name: Lint (root)
        run: npm run lint

      - name: Test (root)
        run: npm test

      - name: Build (root)
        run: npm run build

      - name: Install functions deps
        run: npm --prefix functions ci

      - name: Build functions (if script present)
        run: |
          if npm --prefix functions run build --silent; then
            echo "Functions build succeeded"
          else
            echo "Functions build failed or not present"
            exit 1
          fi

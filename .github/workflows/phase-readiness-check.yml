# LP-workflow-fix-#001: Phase Readiness Check
# Validates local registry exists and is readable
# Optionally validates Firestore attributesMeta matches registry version

name: phase-readiness-check

on:
  pull_request:
    branches: [aoss-main]
  push:
    branches: [aoss-main]

jobs:
  verify:
    name: Verify Attributes Meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup GCloud Service Account
        env:
          GCP_SA_KEY_BASE64: ${{ secrets.GCP_SA_KEY_BASE64 }}
        run: |
          if [ -z "$GCP_SA_KEY_BASE64" ]; then
            echo "⚠️ GCP_SA_KEY_BASE64 secret not configured - skipping Firestore check"
            echo "SKIP_FIRESTORE_CHECK=true" >> $GITHUB_ENV
          else
            echo "$GCP_SA_KEY_BASE64" | base64 --decode > /tmp/sa.json
            echo "GCP_SA_FILE=/tmp/sa.json" >> $GITHUB_ENV
          fi

      - name: Verify local registry (no dependencies needed)
        if: env.SKIP_FIRESTORE_CHECK == 'true'
        run: |
          echo "⚠️ Skipping Firestore verification (no credentials)"
          echo "📦 Checking local attributeRegistry.json..."
          if [ -f "packages/sdk/config/attributeRegistry.json" ]; then
            VERSION=$(node -e "console.log(require('./packages/sdk/config/attributeRegistry.json').version)")
            echo "✅ Local registry version: $VERSION"
            echo "✅ Local registry file exists and is readable"
          else
            echo "❌ Local registry not found at packages/sdk/config/attributeRegistry.json"
            exit 1
          fi

      - name: Install dependencies (only if checking Firestore)
        if: env.SKIP_FIRESTORE_CHECK != 'true'
        run: |
          # Create isolated install for firebase-admin (avoids pnpm workspace protocol issues)
          mkdir -p /tmp/firebase-verify
          cd /tmp/firebase-verify
          npm init -y
          npm install firebase-admin
          # Link node_modules to workspace root
          ln -sf /tmp/firebase-verify/node_modules $GITHUB_WORKSPACE/node_modules

      - name: Run full verify-attributes-meta
        if: env.SKIP_FIRESTORE_CHECK != 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GCP_SA_FILE }}
        run: node scripts/verify-attributes-meta.js --project ropi-bccee

# LP-observations-consolidation-1.5.0: Phase Readiness Check
# Validates Firestore attributesMeta matches registry version

name: phase-readiness-check

on:
  pull_request:
    branches: [aoss-main]
  push:
    branches: [aoss-main]

jobs:
  verify:
    name: Verify Attributes Meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install || npm install

      - name: Setup GCloud Service Account
        env:
          GCP_SA_KEY_BASE64: ${{ secrets.GCP_SA_KEY_BASE64 }}
        run: |
          if [ -z "$GCP_SA_KEY_BASE64" ]; then
            echo "⚠️ GCP_SA_KEY_BASE64 secret not configured - skipping Firestore check"
            echo "SKIP_FIRESTORE_CHECK=true" >> $GITHUB_ENV
          else
            echo "$GCP_SA_KEY_BASE64" | base64 --decode > /tmp/sa.json
            echo "GCP_SA_FILE=/tmp/sa.json" >> $GITHUB_ENV
          fi

      - name: Run verify-attributes-meta
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GCP_SA_FILE }}
          GCP_SA_KEY_BASE64: ${{ secrets.GCP_SA_KEY_BASE64 }}
        run: |
          if [ "$SKIP_FIRESTORE_CHECK" = "true" ]; then
            echo "⚠️ Skipping Firestore verification (no credentials)"
            node scripts/verify-attributes-meta.js --skip-firestore
          else
            echo "🔍 Verifying attributes meta..."
            if node scripts/verify-attributes-meta.js --project ropi-bccee; then
              echo "✅ Verification passed"
            else
              echo "⚠️ Verification failed - attempting to align registry version..."
              if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/aoss-main" ]; then
                echo "🔄 Auto-fixing registry version mismatch for main branch push..."
                node packages/api/scripts/align_registry_version.mjs --apply --project ropi-bccee
                echo "✅ Registry version aligned, retrying verification..."
                node scripts/verify-attributes-meta.js --project ropi-bccee
              else
                echo "❌ Registry version mismatch detected"
                echo "   This is a PR or feature branch - manual alignment required"
                echo "   Run: node packages/api/scripts/align_registry_version.mjs --apply --project ropi-bccee"
                exit 1
              fi
            fi
          fi

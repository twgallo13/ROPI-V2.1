name: Secret smoke test
on:
  workflow_dispatch:
jobs:
  secret-test:
    runs-on: ubuntu-latest
    # Use PRODUCTION environment so environment secrets are available (if configured)
    environment: PRODUCTION
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Show presence of secrets (do not print values)
        run: |
          echo "SERVICE_ACCOUNT_JSON present: ${SERVICE_ACCOUNT_JSON:+yes}"
          echo "VITE_FIREBASE_API_KEY present: ${VITE_FIREBASE_API_KEY:+yes}"
          echo "GEMINI_API_KEY present: ${GEMINI_API_KEY:+yes}"

      - name: Validate SERVICE_ACCOUNT_JSON is parseable
        shell: bash
        run: |
          if [ -z "${SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::SERVICE_ACCOUNT_JSON is missing"
            exit 2
          fi
          # write secret to file for use by firebase-admin
          echo "$SERVICE_ACCOUNT_JSON" > sa.json
          python3 - <<'PY'
import json,sys
try:
  d=json.load(open('sa.json'))
  print("SERVICE_ACCOUNT_JSON parsed: yes")
  print("project_id: %s" % d.get('project_id','<none>'))
except Exception as e:
  print("Failed to parse SERVICE_ACCOUNT_JSON:", e, file=sys.stderr)
  sys.exit(3)
PY

      - name: Install firebase-admin
        run: |
          npm init -y
          npm install firebase-admin@11 --no-audit --no-fund

      - name: Attempt Firestore init & list collections
        shell: bash
        env:
          # Ensure firebase-admin uses the file we wrote
          GOOGLE_APPLICATION_CREDENTIALS: sa.json
        run: |
          node -e "
const admin = require('firebase-admin');
try {
  admin.initializeApp({ credential: admin.credential.cert(require('./sa.json')) });
} catch(e) {
  console.error('Init failed:', e && e.message ? e.message : e);
  process.exit(4);
}
const db = admin.firestore();
db.listCollections().then(cols => {
  console.log('Firestore listCollections OK. Collections count:', cols.length);
  process.exit(0);
}).catch(err => {
 console.error('Firestore call failed:', err && err.message ? err.message : err);
 process.exit(5);
});
"

      - name: Final status
        run: echo "Secret smoke test finished (look above for pass/fail details)."

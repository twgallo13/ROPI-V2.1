name: Importer Mapping Recon CI

on:
  pull_request:
    paths:
      - 'packages/sdk/**'
      - 'packages/api/**'
      - 'packages/web/**'
      - '.github/workflows/importer-mapping-recon-ci.yml'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      node-version: '18'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build SDK (required for tests)
        run: pnpm --filter @ropi-aoss/sdk build
      - name: Run unit tests (SDK)
        run: pnpm --filter @ropi-aoss/sdk test -- --run
      - name: Run unit tests (API)
        run: pnpm --filter @ropi-aoss/api test -- --run || echo "API tests skipped or failed"
      - name: Run unit tests (Web)
        run: pnpm --filter @ropi-aoss/web test -- --run

  dryrun:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build SDK
        run: pnpm --filter @ropi-aoss/sdk build
      - name: Create artifacts directory
        run: mkdir -p artifacts
      - name: Run SDK dry-run (MPN-only)
        run: |
          node packages/sdk/scripts/ci-dryrun.js --csv packages/sdk/scripts/sample-mpn-only.csv --out artifacts/dryrun-sample-mpn-only.json
      - name: Run SDK dry-run (Mixed)
        run: |
          node packages/sdk/scripts/ci-dryrun.js --csv packages/sdk/scripts/sample-mixed.csv --out artifacts/dryrun-sample-mixed.json
      - name: Validate dry-run reports (no missing attribute)
        run: |
          node packages/api/scripts/validate-dryrun-report.js artifacts/dryrun-sample-mpn-only.json || (echo "MPN dryrun errors" && exit 1)
          node packages/api/scripts/validate-dryrun-report.js artifacts/dryrun-sample-mixed.json || (echo "Mixed dryrun errors" && exit 1)
      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-artifacts
          path: artifacts/*.json

  e2e:
    needs: dryrun
    if: github.event.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Run web e2e (if configured)
        run: |
          # If Playwright is configured, run it here
          # pnpm --filter @ropi-aoss/web playwright test --reporter=dot
          echo "E2E tests skipped - run manually on staging"

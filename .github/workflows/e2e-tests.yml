name: E2E Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test against'
        required: false
        default: ''

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      actions: read
    
    env:
      # E2E test user credentials - these match the seeded emulator users
      # For emulator testing, use test-admin@example.com / test-password-123
      VITE_E2E_ADMIN_EMAIL: ${{ inputs.base_url == 'emulator' && 'test-admin@example.com' || 'theo@shiekh.com' }}
      VITE_E2E_USER_EMAIL: ${{ inputs.base_url == 'emulator' && 'test-user@example.com' || 'user@shiekh.com' }}
      VITE_E2E_UNVERIFIED_EMAIL: ${{ inputs.base_url == 'emulator' && 'test-unverified@example.com' || 'unverified@shiekh.com' }}
      VITE_E2E_ADMIN_PASSWORD: ${{ inputs.base_url == 'emulator' && 'test-password-123' || secrets.E2E_ADMIN_PASSWORD }}
      VITE_E2E_USER_PASSWORD: ${{ inputs.base_url == 'emulator' && 'test-password-123' || secrets.E2E_USER_PASSWORD }}
      VITE_E2E_UNVERIFIED_PASSWORD: ${{ inputs.base_url == 'emulator' && 'test-password-123' || secrets.E2E_UNVERIFIED_PASSWORD }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        run: npm install -g pnpm@8
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Install Playwright browsers
        run: cd packages/web && npx playwright install --with-deps chromium
      
      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest
      
      - name: Seed Firebase emulator users (for local/emulator testing)
        if: inputs.base_url == 'emulator' || inputs.base_url == ''
        run: |
          echo "Setting up Firebase emulator environment..."
          export FIREBASE_AUTH_EMULATOR_HOST="127.0.0.1:9099"
          export FIRESTORE_EMULATOR_HOST="127.0.0.1:8080"
          export FIREBASE_PROJECT_ID="demo-ropi-test"
          
          # Start emulators in background, seed users, and verify
          firebase emulators:exec --only auth,firestore --project demo-ropi-test "node scripts/seed_emulator_users.js" || {
            echo "::warning::Emulator seeding skipped or failed - continuing with preview URL tests"
          }
        continue-on-error: true
      
      - name: Wait for preview deployment
        if: github.event_name == 'pull_request'
        run: |
          echo "Waiting for preview deployment to complete..."
          echo "PR number: ${{ github.event.pull_request.number }}"
          echo "Head SHA: ${{ github.event.pull_request.head.sha }}"
          
          # Wait up to 10 minutes for preview workflow to complete
          max_wait=600
          elapsed=0
          interval=15
          
          while [ $elapsed -lt $max_wait ]; do
            echo "Checking for preview deployment workflow... (${elapsed}s elapsed)"
            
            # Query for the "Deploy AOSS PR Preview" workflow matching this PR's head SHA
            RUNS=$(gh run list \
              --workflow="Deploy AOSS PR Preview" \
              --json status,conclusion,headSha,databaseId \
              --jq ".[] | select(.headSha == \"${{ github.event.pull_request.head.sha }}\")")
            
            if [ -n "$RUNS" ]; then
              STATUS=$(echo "$RUNS" | jq -r '.status')
              CONCLUSION=$(echo "$RUNS" | jq -r '.conclusion')
              RUN_ID=$(echo "$RUNS" | jq -r '.databaseId')
              
              echo "Found preview workflow run #${RUN_ID}: status=${STATUS}, conclusion=${CONCLUSION}"
              
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "✅ Preview deployment completed successfully"
                  echo "Extracting preview URL from deployment logs..."
                  
                  # Get the preview URL from the deployment run logs
                  PREVIEW_URL=$(gh run view "${RUN_ID}" --log 2>&1 | \
                    grep -oP 'PREVIEW_URL=\Khttps://[^\s]+' | head -1 || true)
                  
                  if [ -n "$PREVIEW_URL" ]; then
                    echo "Found preview URL: ${PREVIEW_URL}"
                    echo "PREVIEW_URL=${PREVIEW_URL}" >> $GITHUB_ENV
                  else
                    echo "::warning::Could not extract preview URL from logs"
                  fi
                  
                  exit 0
                else
                  echo "::error::Preview deployment failed with conclusion: ${CONCLUSION}"
                  echo "See: https://github.com/${{ github.repository }}/actions/runs/${RUN_ID}"
                  exit 1
                fi
              fi
              
              echo "Preview deployment still in progress (status: ${STATUS})..."
            else
              echo "Preview deployment workflow not found yet for SHA ${{ github.event.pull_request.head.sha }}"
            fi
            
            sleep $interval
            elapsed=$((elapsed + interval))
          done
          
          echo "::error::Timeout waiting for preview deployment after ${max_wait}s"
          echo "Preview deployment workflow may not have started or is taking too long"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: Determine test URL
        id: test-url
        run: |
          if [ -n "${{ inputs.base_url }}" ]; then
            # Manual workflow dispatch with custom URL
            TEST_URL="${{ inputs.base_url }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # Use preview URL from environment (extracted in previous step)
            if [ -n "${PREVIEW_URL:-}" ]; then
              TEST_URL="${PREVIEW_URL}"
            else
              # Fallback: try to construct preview URL
              # Note: Firebase generates random suffix, so this may not work
              PR_NUM=${{ github.event.pull_request.number }}
              TEST_URL="https://ropi-aoss-staging--pr-${PR_NUM}-aoss-staging.web.app"
              echo "::warning::Using constructed preview URL (may be inaccurate): ${TEST_URL}"
            fi
          else
            # Default to staging
            TEST_URL="https://ropi-aoss-staging.web.app"
          fi
          
          echo "TEST_URL=${TEST_URL}"
          echo "base_url=${TEST_URL}" >> $GITHUB_OUTPUT
      
      - name: Wait for deployment to be ready
        run: |
          TEST_URL="${{ steps.test-url.outputs.base_url }}"
          echo "Testing URL: ${TEST_URL}"
          
          # Wait up to 2 minutes for site to be ready
          max_attempts=24
          attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            if curl -f -s -o /dev/null "${TEST_URL}"; then
              echo "✅ Site is ready at ${TEST_URL}"
              exit 0
            fi
            
            echo "Waiting for site to be ready... (attempt $((attempt+1))/${max_attempts})"
            sleep 5
            attempt=$((attempt+1))
          done
          
          echo "::error::Site not ready after 2 minutes at ${TEST_URL}"
          exit 1
      
      - name: Run E2E tests
        env:
          BASE_URL: ${{ steps.test-url.outputs.base_url }}
          CI: true
        run: |
          cd packages/web
          echo "Running E2E tests against: ${BASE_URL}"
          pnpm test:e2e
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: packages/web/test-results/
          retention-days: 7
      
      - name: Comment on PR with results
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## E2E Test Results
            
            **Test URL:** ${{ steps.test-url.outputs.base_url }}
            **Status:** ${{ job.status }}
            
            View detailed results in the [Actions run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            
            Download artifacts:
            - Playwright HTML report
            - Test screenshots and videos (on failure)
# Trigger E2E re-run

/**
 * adminAuth.ts
 *
 * Lightweight, robust admin login helper for E2E tests.
 * - Retries up to `maxAttempts` times (default 3)
 * - Uses bounded waitForSelector per attempt (default 30s)
 * - Captures diagnostics (screenshot + DOM) on failure attempt
 *
 * Usage:
 *   import { loginAsAdminWithRetries } from '../helpers/adminAuth';
 *   await loginAsAdminWithRetries(page);
 */

import fs from 'fs';
import path from 'path';

type Options = {
  maxAttempts?: number;
  selectorTimeout?: number;
  authResponseTimeout?: number;
  spinnerTimeout?: number;
  backoffMs?: number;
};

function ensureLogsDir() {
  const logsDir = path.resolve(process.cwd(), 'logs');
  if (!fs.existsSync(logsDir)) fs.mkdirSync(logsDir, { recursive: true });
  return logsDir;
}

async function captureDiagnostics(page: any, name: string) {
  try {
    const logsDir = ensureLogsDir();
    const ts = Date.now();
    const screenshotPath = path.join(logsDir, `${name}-screenshot-${ts}.png`);
    const domPath = path.join(logsDir, `${name}-dom-${ts}.html`);
    await page.screenshot({ path: screenshotPath, fullPage: true }).catch(()=>null);
    const html = await page.content();
    fs.writeFileSync(domPath, html);
    // Also try to capture console messages if supported
    // (note: page.on('console'...) should be configured in the test harness if desired)
  } catch (e) {
    // swallow
    // eslint-disable-next-line no-console
    console.warn('captureDiagnostics failed', e);
  }
}

async function checkPreviewHealth(page: any): Promise<boolean> {
  // Optional: check a lightweight preview/health endpoint (if available)
  // Many deployments don't expose this. If you do have one, set PREVIEW_HEALTH=/_preview/health or similar
  const pathEnv = process.env.PREVIEW_HEALTH_PATH;
  if (!pathEnv) return true; // no health check configured -> skip
  try {
    const res = await page.request.get(pathEnv, { timeout: 5000 });
    return res.ok();
  } catch (err) {
    return false;
  }
}

export async function loginAsAdminWithRetries(page: any, opts: Options = {}) {
  const {
    maxAttempts = 3,
    selectorTimeout = 30000,
    authResponseTimeout = 15000,
    spinnerTimeout = 5000,
    backoffMs = 1000,
  } = opts;

  // Validate environment credentials
  const email = process.env.E2E_ADMIN_EMAIL;
  const pass = process.env.E2E_ADMIN_PASSWORD;
  if (!email || !pass) {
    throw new Error('E2E_ADMIN_EMAIL and E2E_ADMIN_PASSWORD must be set in environment for E2E admin login.');
  }

  const previewOk = await checkPreviewHealth(page).catch(()=>false);
  if (!previewOk) {
    // If health check fails, we still attempt login but note it
    // eslint-disable-next-line no-console
    console.warn('Preview health check failed or not configured; proceeding with login attempts.');
  }

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      // Navigate to login page, prefer the admin login route used by your app
      await page.goto('/admin/login', { waitUntil: 'networkidle' });

      // Fill login form - adapt selectors to your app
      await page.fill('input[name="email"], #email', email);
      await page.fill('input[name="password"], #password', pass);

      // Wait for a network response that indicates auth (if your app hits /api/auth or /session)
      const authResponsePromise = page.waitForResponse((resp: any) => {
        const url = String(resp.url()).toLowerCase();
        return url.includes('/api/auth') || url.includes('/session') || url.includes('/login');
      }, { timeout: authResponseTimeout }).catch(()=>null);

      // Click submit and race with auth response
      await Promise.all([
        page.click('button[type="submit"], button:has-text("Sign in"), button:has-text("Log in")'),
        authResponsePromise,
      ]);

      // If response present and it's an error code, fail fast
      const resp = await authResponsePromise;
      if (resp && resp.status() >= 400) {
        const text = await resp.text().catch(()=>'<no-body>');
        throw new Error(`Auth endpoint returned ${resp.status()}: ${text}`);
      }

      // Now wait for the in-app indicator: Attribute Manager heading
      // This is the critical selector: adjust if your app uses a different heading text
      await page.waitForSelector('h1:has-text("Attribute Manager")', { timeout: selectorTimeout });

      // Optionally wait for spinner to hide (if applicable)
      await page.waitForSelector('.loading-spinner', { state: 'hidden', timeout: spinnerTimeout }).catch(()=>null);

      // Success
      // eslint-disable-next-line no-console
      console.log(`Admin login succeeded on attempt ${attempt}`);
      return;
    } catch (err: any) {
      // eslint-disable-next-line no-console
      console.warn(`Admin login attempt ${attempt} failed: ${err?.message ?? err}`);
      await captureDiagnostics(page, `admin-login-attempt-${attempt}`);

      if (attempt === maxAttempts) {
        // Final failure: throw up
        throw new Error(`Admin login failed after ${maxAttempts} attempts. Last error: ${err?.message ?? err}`);
      }
      // Backoff before retrying
      const waitMs = Math.min(5000, backoffMs * 2 ** (attempt - 1));
      // eslint-disable-next-line no-console
      console.log(`Waiting ${waitMs}ms before retrying admin login...`);
      await new Promise(r => setTimeout(r, waitMs));
    }
  }
}
